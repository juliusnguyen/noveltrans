[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noveltrans"
version = "0.1.0"
description = "Scrape, translate (zh -> vi/en) and export Chinese web novels — PySide6 desktop app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "deep-translator>=1.11",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0",  # draw the video player skin (gradient, rounded photo, widget)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.4",
]
tts = [
    "vieneu>=3.4",  # VieNeu-TTS, torch-free ONNX runtime (~334 MB model on first run)
]
tts-gpu = [
    # PyTorch+CUDA path for VieNeu-TTS v3 Turbo on NVIDIA GPUs (opt-in: multi-GB
    # download, source-install only -- not bundled in the packaged .exe). Needs
    # >=3.6.1: earlier vieneu releases (including the >=3.4 floor of the `tts`
    # extra above) already have the device="cuda" code path but no formal `cuda`
    # extra to pull torch/transformers/safetensors. Installing this extra
    # resolves `vieneu` to a version satisfying both extras at once (pip picks
    # one version per package) -- expected to upgrade vieneu project-wide, not a bug.
    #
    # VERIFIED: installing this alone gets a CPU-ONLY torch wheel from PyPI's default
    # index (confirmed on Windows) -- it does NOT pull CUDA automatically. Follow up
    # with `uv pip install torch --index-url https://download.pytorch.org/whl/cu128`
    # (or the matching build for your driver) to actually get GPU support. See the
    # "GPU (NVIDIA CUDA)" section in README.md.
    "vieneu[cuda]>=3.6.1",
]
browser = [
    # Features that drive a real browser: medoctruyen's Discord auto-unlock, and
    # reading 69shuba (which sits behind a Cloudflare challenge only a real browser
    # passes). After installing, run `playwright install chromium` once — or just have
    # Google Chrome installed, which is preferred and used automatically.
    "playwright>=1.40",
]
discord = [
    # Back-compat alias: this was the browser extra before 69shuba needed one too.
    "noveltrans[browser]",
]
build = [
    "pyinstaller>=6.0",  # package the macOS .app (see `make app` / `make dmg`)
]

[project.scripts]
noveltrans = "noveltrans.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noveltrans = [
    "translators/data/*.json",
    "tts/assets/*.ttf", "tts/assets/*.txt", "tts/assets/*.png",
    "gui/assets/*.png",  # app icon + menu-bar glyph, generated by `make icon`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real websites (excluded by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
