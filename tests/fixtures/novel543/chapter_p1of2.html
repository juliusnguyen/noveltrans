      <h1>第1章 星圖上的第1個座標 (1/2)</h1>
      <div class="content py-5">
      <div class="gadBlock"></div>
      <p>港務官把航行紀錄推到燈下，紙面上的座標一行行浮現出來。</p>
      <div class="adBlock" data-ad="tamedia-300x250"><div id="div-tam-ad-x"></div></div>
      <p>那些數字他認得，卻沒有一組落在現行的星圖上。</p>
      <p>「這些航線，你走了多久？」他問。</p>
      <p>旅人沒有回答，只是把手按在艦身的裂痕上。</p>
      <div class="gadBlock"></div>
      <p>遠處的封鎖燈亮起，把整座港口照成蒼白的一片。</p>
