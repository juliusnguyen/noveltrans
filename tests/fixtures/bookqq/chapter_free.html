      <p>第一章 山门</p>
      <p>山门之外落着薄雪，石阶一路向上，看不见尽头。</p>
      <p>他把手里的伞收起来，抖了抖上面的雪，抬头望了一眼。</p>
      <p>守门的老人打了个哈欠，问他找谁。</p>
