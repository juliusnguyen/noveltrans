<p>놖走進院子，看見一棵老樹。</p>
<p>놛沒有說話，只是點了點頭。</p>
<div class="gadBlock narrow"><ins class="clickforceads">holmesmind</ins></div>

<p>兩個人늀這樣站著，誰也놊開口。</p>
